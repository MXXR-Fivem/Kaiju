[package]
name = "kaiju-backend"
version = "0.1.0"
edition = "2021"
authors = ["Théo Busiris <theo.busiris@epitech.eu>"]

[dependencies]
actix-cors = "0.7"
actix-web = "4.9"
actix-ws = "0.3"
bcrypt = "0.17"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
env_logger = "0.11"
futures-util = "0.3"
jsonwebtoken = "9.3"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono"] }
thiserror = "1.0"
tokio = { version = "1.38", features = ["full"] }
uuid = { version = "1.8", features = ["v4"] }
