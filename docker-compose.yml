services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kaiju-backend
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - APP_ENV=${APP_ENV:-production}
      - PORT=8080
      - HOST=0.0.0.0
      - DATABASE_URL=sqlite:///app/data/kaiju.db
      - GOD_MODE_PASSWORD=${GOD_MODE_PASSWORD:-kaiju-omega-protocol-2026}
      - JWT_SECRET=${JWT_SECRET:-super_emergency_secret_key_kaiju_tokyork_331}
      - RUST_LOG=info
    volumes:
      - kaiju-data:/app/data
    networks:
      - kaiju-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kaiju-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - kaiju-net

volumes:
  kaiju-data:
    driver: local

networks:
  kaiju-net:
    driver: bridge
