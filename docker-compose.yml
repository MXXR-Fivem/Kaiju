services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 8080
      DATABASE_URL: sqlite:///app/data/kaiju.db
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant dans .env}
      GOD_MODE_PASSWORD: ${GOD_MODE_PASSWORD:-}
      RUST_LOG: info
    volumes:
      - kaiju-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-4200}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  kaiju-data:
